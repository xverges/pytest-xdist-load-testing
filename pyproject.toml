[build-system]
requires = [
  "setuptools>=61.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-xdist-load-testing"
description = "xdist scheduler to repeately run tests"
version = "0.2.2"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Xavier Vergés", email = "github@verg.es" },
]
maintainers = [
    { name = "Xavier Vergés", email = "github@verg.es" },
]
license = {file = "LICENSE"}
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
]
[project.urls]
Repository = "https://github.com/xverges/pytest-xdist-load-testing"
[project.entry-points.pytest11]
xdist-load-testing = "pytest_xdist_load_testing.plugin"
